services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    hostname: metabase
    ports:
      - 3000:3000
    # Metabase 使用內建 H2 資料庫存設定（免依賴外部 DB）
    # 啟動後在 Web UI 設定 → 新增資料庫 → 填 MySQL 連線資訊即可查詢股價資料
    volumes:
      - metabase-data:/metabase-data      # 持久化 Metabase 設定（dashboard、帳號等）
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    networks:
      - my_network
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  metabase-data:

networks:
  my_network:
    external: true
