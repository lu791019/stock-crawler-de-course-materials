
x-airflow-common: &airflow-common
  image: stock-airflow:latest  
  environment:
    # Airflow 核心設定
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Taipei
    # 覆蓋 .env 的主機模式設定：Airflow 是容器，要用容器名連 MySQL / RabbitMQ。
    # （.env 的 127.0.0.1 是給第 1-9 章「程式跑在主機上」的情境用的；
    #   environment 的優先序高於 env_file，所以這裡的值會蓋過 .env。）
    MYSQL_HOST: mysql
    RABBITMQ_HOST: rabbitmq
  env_file:
    - ../.env
  volumes:
    # 將 airflow.cfg、dags、plugins、logs 掛載到容器中，讓 Airflow 可以使用 airflow.cfg 下的設定
    - ./airflow.cfg:/opt/airflow/airflow.cfg
    - ./dags:/opt/airflow/dags  # 同步 dags 資料夾，讓改動的 dag 可以即時生效
    - ./plugins:/opt/airflow/plugins
    - ./logs:/opt/airflow/logs
    # 將 crawler 和 output 掛載到容器中，讓 Airflow 可以執行 crawler 下的 Python 程式
    - ../crawler:/opt/airflow/crawler
    - ../output:/opt/airflow/output
    # 將 docker.sock 掛載到容器中，讓 Airflow 可以執行 docker 命令
    - /var/run/docker.sock:/var/run/docker.sock
  networks:
    - my_network  # 加入 MySQL 的網路

services:
  postgres:
    image: postgres:13
    container_name: airflow-database
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks:
      - my_network

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
      airflow db init &&
      airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASS:-admin} --firstname Apache --lastname Airflow --role Admin --email admin@example.com
      "
    depends_on:
      - postgres

  airflow-webserver:
    <<: *airflow-common
    command: >
      bash -c "exec airflow webserver"
    container_name: airflow-webserver
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL","curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: >
      bash -c "exec airflow scheduler"
    container_name: airflow-scheduler
    depends_on:
      - airflow-init

volumes:
  postgres-db-volume:

networks:
  my_network:
    external: true  # 使用已存在的外部網路
