services:

  rabbitmq:
    # 使用 RabbitMQ 官方管理版的輕量 Alpine 版本映像檔（支援 amd64 / arm64）
    image: 'rabbitmq:3.13-management-alpine'
    ports: 
      - '5672:5672'       # 對外開放 RabbitMQ 的 AMQP 通訊埠（應用程式通訊埠）
      - '15672:15672'     # 對外開放 RabbitMQ 的管理介面（Web UI）埠口
    environment:
      RABBITMQ_DEFAULT_USER: "worker"       # 預設使用者名稱設定為 worker
      RABBITMQ_DEFAULT_PASS: "worker"       # 預設密碼設定為 worker
      RABBITMQ_DEFAULT_VHOST: "/"            # 預設虛擬主機 (Virtual Host)
    networks:
      - my_network                          # 與 worker/mysql 使用同一個外部網路

  flower:
    # 使用 Flower 映像來監控 Celery 的任務佇列狀況（支援 amd64 / arm64）
    image: mher/flower:2.0
    command: ["celery", "--broker=amqp://worker:worker@rabbitmq", "flower", "--port=5555"]
    ports: 
      - 5555:5555
    depends_on:
      - rabbitmq
    networks:
      - my_network

networks:
  my_network:
    external: true                        # 使用 docker network create my_network 預先建立的網路
