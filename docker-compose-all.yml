# 全服務整合 docker-compose
# 包含：RabbitMQ + Flower + MySQL + phpMyAdmin + Celery Worker + Airflow + Metabase
#
# 使用方式：
#   cp .env.example .env
#   docker build -f airflow/Dockerfile -t stock-airflow:latest .
#   docker compose -f docker-compose-all.yml up -d
#
# Port 分配：
#   5672  - RabbitMQ (AMQP)
#   15672 - RabbitMQ 管理介面
#   5555  - Flower（Celery 監控）
#   3306  - MySQL
#   8080  - phpMyAdmin
#   8081  - Airflow Web UI
#   8082  - mongo-express（補充F，選用）
#   3000  - Metabase

services:

  # ===== Message Broker =====
  rabbitmq:
    image: 'rabbitmq:3.13-management-alpine'
    container_name: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: "worker"
      RABBITMQ_DEFAULT_PASS: "worker"
      RABBITMQ_DEFAULT_VHOST: "/"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  flower:
    image: mher/flower:2.0
    container_name: flower
    command: ["celery", "--broker=amqp://worker:worker@rabbitmq", "flower", "--port=5555"]
    ports:
      - 5555:5555
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ===== Database =====
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "mydb"
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      # volume 第一次建立時自動建 Metabase 設定庫（既有 volume 不會重跑）
      - ./metabase/init-metabase-appdb.sql:/docker-entrypoint-initdb.d/init-metabase-appdb.sql
    healthcheck:
      test: mysqladmin ping -h localhost -uroot -p1234
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: "1234"
    depends_on:
      mysql:
        condition: service_healthy

  # ===== Celery Workers =====
  crawler_twse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crawler_twse
    command: uv run celery -A crawler.worker worker --loglevel=info --hostname=twse@%h -Q twse
    environment:
      RABBITMQ_HOST: rabbitmq
      MYSQL_HOST: mysql
      MONGO_HOST: mongodb   # 補充F：worker 連 MongoDB 用服務名
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}   # 雙寫用：up 時從主機環境注入；沒設就略過 BQ（手冊15）
      SPANNER_PROJECT_ID: ${SPANNER_PROJECT_ID:-}   # 手冊16 Spanner 體驗用，平常不設
      SPANNER_INSTANCE: ${SPANNER_INSTANCE:-}
      SPANNER_DATABASE: ${SPANNER_DATABASE:-stockdb}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - ./output:/crawler/output

  crawler_tpex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crawler_tpex
    command: uv run celery -A crawler.worker worker --loglevel=info --hostname=tpex@%h -Q tpex
    environment:
      RABBITMQ_HOST: rabbitmq
      MYSQL_HOST: mysql
      MONGO_HOST: mongodb   # 補充F：worker 連 MongoDB 用服務名
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}   # 雙寫用：up 時從主機環境注入；沒設就略過 BQ（手冊15）
      SPANNER_PROJECT_ID: ${SPANNER_PROJECT_ID:-}   # 手冊16 Spanner 體驗用，平常不設
      SPANNER_INSTANCE: ${SPANNER_INSTANCE:-}
      SPANNER_DATABASE: ${SPANNER_DATABASE:-stockdb}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - ./output:/crawler/output

  # ===== Airflow =====
  airflow-postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    image: stock-airflow:latest
    container_name: airflow-init
    command: >
      bash -c "
      airflow db init &&
      airflow users create --username admin --password admin --firstname Apache --lastname Airflow --role Admin --email admin@example.com
      "
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Taipei
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-webserver:
    image: stock-airflow:latest
    container_name: airflow-webserver
    command: bash -c "exec airflow webserver"
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Taipei
      RABBITMQ_HOST: rabbitmq
      MYSQL_HOST: mysql
      MONGO_HOST: mongodb   # 補充F：worker 連 MongoDB 用服務名
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}   # 手冊17 transform task 用；沒設就略過 BQ
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/airflow.cfg:/opt/airflow/airflow.cfg
      - ./crawler:/opt/airflow/crawler
      - ./output:/opt/airflow/output
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: stock-airflow:latest
    container_name: airflow-scheduler
    command: bash -c "exec airflow scheduler"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Taipei
      RABBITMQ_HOST: rabbitmq
      MYSQL_HOST: mysql
      MONGO_HOST: mongodb   # 補充F：worker 連 MongoDB 用服務名
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}   # 手冊17 transform task 用；沒設就略過 BQ
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/airflow.cfg:/opt/airflow/airflow.cfg
      - ./crawler:/opt/airflow/crawler
      - ./output:/opt/airflow/output
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ===== BI Tool =====
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - 3000:3000
    # 設定庫放 MySQL 的 metabasedb（由 init-metabase-appdb.sql 在 volume 初始化時建立）
    environment:
      MB_DB_TYPE: mysql
      MB_DB_HOST: mysql
      MB_DB_PORT: 3306
      MB_DB_DBNAME: metabasedb
      MB_DB_USER: metabase_app
      MB_DB_PASS: "1234"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10


  # ── MongoDB（補充F 用；平常不啟動，不影響主線）────────────────
  # 啟動: docker compose -f docker-compose-local.yml up -d mongodb mongo-express
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root   # 跟 MySQL 一樣的教學帳密慣例
      MONGO_INITDB_ROOT_PASSWORD: "1234"
    volumes:
      - mongodb:/data/db

  # mongo-express: MongoDB 的 Web 管理介面（= phpMyAdmin 之於 MySQL）
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8082:8081"                      # 8082: 避開 phpMyAdmin(8080) 與 Airflow(8081)
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:1234@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: root # 開網頁時要輸入的帳密
      ME_CONFIG_BASICAUTH_PASSWORD: "1234"
    depends_on:
      - mongodb

volumes:
  mysql-data:
  mongodb:
  airflow-postgres-data:
