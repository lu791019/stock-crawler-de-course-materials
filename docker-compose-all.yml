# 全服務整合 docker-compose
# 包含：RabbitMQ + Flower + MySQL + phpMyAdmin + Celery Worker + Airflow + Metabase
#
# 使用方式：
#   cp .env.example .env
#   docker build -f airflow/Dockerfile -t stock-airflow:latest .
#   docker compose -f docker-compose-all.yml up -d
#
# Port 分配：
#   5672  - RabbitMQ (AMQP)
#   15672 - RabbitMQ 管理介面
#   5555  - Flower（Celery 監控）
#   3306  - MySQL
#   8080  - phpMyAdmin
#   8081  - Airflow Web UI
#   3000  - Metabase

services:

  # ===== Message Broker =====
  rabbitmq:
    image: 'rabbitmq:3.13-management-alpine'
    container_name: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: "worker"
      RABBITMQ_DEFAULT_PASS: "worker"
      RABBITMQ_DEFAULT_VHOST: "/"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  flower:
    image: mher/flower:2.0
    container_name: flower
    command: ["celery", "--broker=amqp://worker:worker@rabbitmq", "flower", "--port=5555"]
    ports:
      - 5555:5555
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ===== Database =====
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "mydb"
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h localhost -uroot -p1234
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: "1234"
    depends_on:
      mysql:
        condition: service_healthy

  # ===== Celery Workers =====
  crawler_twse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crawler_twse
    command: uv run celery -A crawler.worker worker --loglevel=info --hostname=twse@%h -Q twse
    environment:
      RABBITMQ_HOST: rabbitmq
      MYSQL_HOST: mysql
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - ./output:/crawler/output

  crawler_tpex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crawler_tpex
    command: uv run celery -A crawler.worker worker --loglevel=info --hostname=tpex@%h -Q tpex
    environment:
      RABBITMQ_HOST: rabbitmq
      MYSQL_HOST: mysql
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - ./output:/crawler/output

  # ===== Airflow =====
  airflow-postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    image: stock-airflow:latest
    container_name: airflow-init
    command: >
      bash -c "
      airflow db init &&
      airflow users create --username admin --password admin --firstname Apache --lastname Airflow --role Admin --email admin@example.com
      "
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Taipei
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-webserver:
    image: stock-airflow:latest
    container_name: airflow-webserver
    command: bash -c "exec airflow webserver"
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Taipei
      RABBITMQ_HOST: rabbitmq
      MYSQL_HOST: mysql
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/airflow.cfg:/opt/airflow/airflow.cfg
      - ./crawler:/opt/airflow/crawler
      - ./output:/opt/airflow/output
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: stock-airflow:latest
    container_name: airflow-scheduler
    command: bash -c "exec airflow scheduler"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Taipei
      RABBITMQ_HOST: rabbitmq
      MYSQL_HOST: mysql
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/airflow.cfg:/opt/airflow/airflow.cfg
      - ./crawler:/opt/airflow/crawler
      - ./output:/opt/airflow/output
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ===== BI Tool =====
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - 3000:3000
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  airflow-postgres-data:
  metabase-data:
